<!-- Applique le thème mémorisé avant le premier affichage (évite un flash). -->

  try {
    const theme = localStorage.getItem('postit-theme')
    if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
  } catch {}
</script>
