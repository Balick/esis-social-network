name: Proposer une idée
description: Une nouvelle fonctionnalité, un composant ou une amélioration.
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Le besoin
      description: Quel problème cette idée résout-elle ? Pour qui ?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: La solution envisagée
      description: Décrivez le résultat attendu. Une maquette ou un croquis est le bienvenu.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
  - type: checkboxes
    id: constraints
    attributes:
      label: Contraintes du projet
      options:
        - label: Mon idée reste faisable en HTML/CSS, sans framework ni étape de build.
          required: true
        - label: Je suis partant·e pour la réaliser moi-même.
